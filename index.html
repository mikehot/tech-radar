// Quadrant angle bounds (in degrees)
const quadAngles = {
  ai_agents: { start: 190, end: 260 },     // NW
  mobile_stack: { start: 280, end: 350 },  // NE
  fde_delivery: { start: 100, end: 170 },  // SW
  indie_biz: { start: 10, end: 80 }        // SE
};

// Ring radius bounds (in px)
const ringRadii = {
  adopt: { min: 25, max: 70, color: "#10b981" },
  trial: { min: 95, max: 165, color: "#0ea5e9" },
  assess: { min: 195, max: 265, color: "#f59e0b" },
  hold: { min: 295, max: 360, color: "#ef4444" }
};

function renderRadar(filterQuad = "all") {
  const g = document.getElementById("blipsGroup");
  const list = document.getElementById("sidebarList");
  g.innerHTML = "";
  list.innerHTML = "";

  const filtered = filterQuad === "all" ? entries : entries.filter(e => e.quadrant === filterQuad);
  document.getElementById("sidebarTitle").innerText = `🎯 技术决策明细 (${filtered.length} 项)`;

  filtered.forEach((item, idx) => {
    const qBounds = quadAngles[item.quadrant] || { start: 190, end: 260 };
    const rBounds = ringRadii[item.ring] || { min: 195, max: 265, color: "#f59e0b" };

    // Deterministic pseudo-random distribution based on item name string hash
    let hash = 0;
    for (let i = 0; i < item.name.length; i++) hash = (hash << 5) - hash + item.name.charCodeAt(i);
    const normAngle = Math.abs(hash % 100) / 100;
    const normRadius = Math.abs((hash >> 3) % 100) / 100;

    const angleDeg = qBounds.start + normAngle * (qBounds.end - qBounds.start);
    const angleRad = (angleDeg * Math.PI) / 180;
    const radius = rBounds.min + normRadius * (rBounds.max - rBounds.min);

    const x = Math.round(radius * Math.cos(angleRad));
    const y = Math.round(radius * Math.sin(angleRad));

    // Render SVG Blip
    const blipG = document.createElementNS("http://www.w3.org/2000/svg", "g");
    blipG.setAttribute("transform", `translate(${x}, ${y})`);
    blipG.setAttribute("style", "cursor: pointer; transition: transform 0.2s;");

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("r", item.is_new ? "9" : "7");
    circle.setAttribute("fill", rBounds.color);
    circle.setAttribute("stroke", "#060913");
    circle.setAttribute("stroke-width", "2");

    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("y", "4");
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("fill", "#000");
    text.setAttribute("font-size", "9");
    text.setAttribute("font-weight", "900");
    text.textContent = (idx + 1).toString();

    blipG.appendChild(circle);
    blipG.appendChild(text);

    // Blip Title tooltip
    const titleElem = document.createElementNS("http://www.w3.org/2000/svg", "title");
    titleElem.textContent = `#${idx + 1} [${item.ring.toUpperCase()}] ${item.name}
${item.description}`;
    blipG.appendChild(titleElem);

    g.appendChild(blipG);

    // Sidebar Item
    const div = document.createElement("div");
    div.className = "blip-item";
    div.innerHTML = `
      <div class="blip-item-header">
        <span class="blip-name">#${idx + 1} ${item.name}</span>
        <span class="badge-ring ring-${item.ring}">${item.ring}</span>
      </div>
      <div class="blip-desc">${item.description}</div>
    `;
    list.appendChild(div);
  });
}

function filterRadar(quad) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
  renderRadar(quad);
}

renderRadar("all");
</script>
